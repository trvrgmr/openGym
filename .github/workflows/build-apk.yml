name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: always

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Mobile Bundle (Capacitor Sync)
        working-directory: frontend
        run: npm run build:mobile

      - name: Compile Android Debug Sideload APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon assembleSideloadDebug

      - name: Locate and Prepare APK
        id: prepare-apk
        run: |
          mkdir -p release-apk
          APK_PATH=$(find frontend/android/app/build/outputs/apk/sideload/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" release-apk/openGym-custom.apk
          echo "apk_path=release-apk/openGym-custom.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-custom-apk
          path: release-apk/openGym-custom.apk
          if-no-files-found: error
          retention-days: 30
